  <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<clipPath id="hero-clip"><rect width="1200" height="360" rx="26"/></clipPath>
<pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#e6ebf0" stroke-opacity="0.045"/>
</pattern>
<linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0c1014"/>
  <stop offset="1" stop-color="#0a0c0f"/>
</linearGradient></defs>

<g clip-path="url(#hero-clip)">
  <rect width="1200" height="360" fill="url(#hero-bg)"/>
  <rect width="1200" height="360" fill="url(#hero-grid)"/>
  <circle cx="140" cy="60" r="300" fill="url(#g-glow-p)"/>
  <circle cx="1040" cy="330" r="280" fill="url(#g-glow-s)"/>
  <rect x="-260" y="0" width="220" height="360" fill="url(#g-shine)" opacity="0.09" transform="skewX(-18)">
