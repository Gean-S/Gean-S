  </rect>
  <rect x="0" y="0" width="1200" height="2" fill="url(#g-line)" opacity="0.9"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="359" rx="26" fill="none" stroke="#242b34"/>

<!-- coluna esquerda -->
