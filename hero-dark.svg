<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Gean Santos — Desenvolvedor Web · Front-end &amp; Back-end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
<title>Gean Santos — Desenvolvedor Web · Front-end &amp; Back-end</title>
<defs>
<linearGradient id="g-accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#c6f432"/>
  <stop offset="1" stop-color="#f2b441"/>
</linearGradient>
<linearGradient id="g-accent-v" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0" stop-color="#c6f432"/>
  <stop offset="1" stop-color="#f2b441"/>
</linearGradient>
<radialGradient id="g-glow-p" cx="50%" cy="50%" r="50%">
  <stop offset="0" stop-color="#c6f432" stop-opacity="0.32"/>
  <stop offset="1" stop-color="#c6f432" stop-opacity="0"/>
</radialGradient>
<radialGradient id="g-glow-s" cx="50%" cy="50%" r="50%">
  <stop offset="0" stop-color="#f2b441" stop-opacity="0.28"/>
  <stop offset="1" stop-color="#f2b441" stop-opacity="0"/>
</radialGradient>
<linearGradient id="g-line" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#c6f432" stop-opacity="0"/>
  <stop offset="0.35" stop-color="#c6f432"/>
  <stop offset="0.65" stop-color="#f2b441"/>
  <stop offset="1" stop-color="#f2b441" stop-opacity="0"/>
</linearGradient>
<linearGradient id="g-shine" x1="0" y1="0" x2="1" y2="0">
