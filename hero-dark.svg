  <text x="-3" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-1.5" fill="#e6ebf0">Gean Santos</text>
  <text x="0" y="192" font-size="16.5" fill="#8b96a3">HTML, CSS, JavaScript, TypeScript, PHP e SQL.</text><text x="0" y="216" font-size="16.5" fill="#8b96a3">Design e manutenção de computadores também.</text>
  <g transform="translate(0 258)">
    <rect x="-14" y="-19" width="345.59999999999997" height="32" rx="8" fill="#11151a" stroke="#242b34"/>
    <text x="0" y="3" font-size="16" fill="#e6ebf0"><tspan fill="#f2b441">$ </tspan>2 a 4 horas de código por dia</text>
    <rect x="305.59999999999997" y="-12" width="8" height="18" fill="#c6f432"><animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></rect>
  </g>
  <g transform="translate(0 320)">
    <circle cx="6" cy="-4" r="4" fill="#c6f432"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="6" cy="-4" r="4" fill="none" stroke="#c6f432"><animate attributeName="r" values="4;10" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite"/></circle>
    <text x="20" y="0" font-size="12" letter-spacing="0.5" fill="#8b96a3">web, design e manutenção de computadores</text>
  </g>
</g>

